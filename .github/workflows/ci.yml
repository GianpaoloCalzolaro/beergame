name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      # `npm run build` is `tsc -b && vite build`: it doubles as the type-check.
      # No Firebase credentials are needed at build time (the app only throws on
      # missing config at runtime in the browser).
      - name: Build (type-check + bundle)
        run: npm run build

  e2e:
    name: E2E (Playwright, chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run Playwright smoke tests
        run: npx playwright test --project=chromium
        # Dummy Firebase config so the SPA boots in CI. The smoke tests only
        # exercise local UI (no Firebase network calls), so real credentials are
        # not required; non-empty values just satisfy the startup validation in
        # src/firebase.ts. Replace with VITE_SUPABASE_* once migrated.
        env:
          VITE_FIREBASE_API_KEY: ci-dummy-api-key
          VITE_FIREBASE_AUTH_DOMAIN: ci-dummy.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: ci-dummy
          VITE_FIREBASE_STORAGE_BUCKET: ci-dummy.appspot.com
          VITE_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
          VITE_FIREBASE_APP_ID: "1:000000000000:web:0000000000000000000000"
          VITE_RECAPTCHA_SITE_KEY: ci-dummy-recaptcha-key
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
